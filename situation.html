  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Situation · Refugee Finder</title>
  <meta name="description" content="One displacement situation, explained first, with every number traced to its source.">

  <script>/* theme before first paint: ?theme= > saved choice > system setting */(function(){var t=null;try{var q=new URLSearchParams(location.search).get("theme");t=q==="light"||q==="dark"?q:JSON.parse(localStorage.getItem("wv1:theme"))}catch(e){}if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t})()</script>
  <script>/* a page transition the browser drops (aborted: "Page already revealed") is not an error: silence only that rejection */addEventListener("unhandledrejection",function(e){var r=e.reason;if(r&&r.name==="InvalidStateError"&&/^Transition was aborted/.test(r.message||""))e.preventDefault()})</script>
  <script>addEventListener("pagereveal",function(e){window.wv1Revealed=true;try{if(e.viewTransition&&sessionStorage.getItem("wv1:morph"))e.viewTransition.skipTransition()}catch(x){}},{once:true})</script>
  <script type="module" src="js/situation.js"></script>
</head>

  <main id="main" tabindex="-1">
